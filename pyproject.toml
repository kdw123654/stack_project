[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-backend-a"
version = "0.2.0"
description = "STACK document extraction and AI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.18,<1",
    "pypdf>=6,<8",
    "openai>=2,<3",
    "pydantic-settings>=2.6,<3",
    "python-docx>=1.2,<2",
    "python-pptx>=1,<2",
    "pypdfium2>=4,<6",
    "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
