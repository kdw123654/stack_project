name: 학교 공지 수집

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: B 서버에 수집 요청
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 120 --retry 3 --retry-delay 30 -X POST "$BACKEND_URL/api/v1/admin/sync-notices" -H "X-Cron-Secret: $CRON_SECRET"